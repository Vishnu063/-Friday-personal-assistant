name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test read-only companion
        run: python3 -m unittest discover -s tests -v
      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Print character test diagnostics on failure
        if: failure()
        run: |
          if [ -f app/build/test-results/testDebugUnitTest/TEST-com.friday.assistant.CharacterTest.xml ]; then
            cat app/build/test-results/testDebugUnitTest/TEST-com.friday.assistant.CharacterTest.xml
          fi
      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-android-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
